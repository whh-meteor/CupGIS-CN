name: Update website previews

on:
  push:
    branches: [main]
    paths:
      - 'sites.json'
      - 'lib/config.js'
      - 'scripts/capture-previews.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-previews
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run previews
      - name: Save new previews
        run: |
          git add assets/previews/
          if git diff --cached --quiet; then
            echo "No preview changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update website preview images"
          git pull --rebase origin main
          git push origin HEAD:main
